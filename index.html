<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KontexEditor — demo</title>
    <style>
      body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
      h1 { margin-bottom: 4px; }
      .muted { color: #777; margin-top: 0; }
      .row { display: flex; gap: 8px; margin: 16px 0; }
      button { padding: 6px 12px; cursor: pointer; }
      pre { background: #f5f5f5; padding: 12px; border-radius: 4px; overflow: auto; max-height: 220px; }
    </style>
  </head>
  <body>
    <h1>KontexEditor</h1>
    <p class="muted">Demo — bound to a &lt;textarea&gt;, CKEditor-style.</p>

    <form id="demo-form">
      <textarea name="body" rows="6">
        <h2>Welcome to KontexEditor</h2>
        <p>This content was <strong>preloaded</strong> from the textarea's value.</p>
        <ul><li>Lightweight TipTap core</li><li>Tables, images, source view</li></ul>
      </textarea>
    </form>

    <div class="row">
      <button type="button" id="get">Fetch HTML (getHTML)</button>
      <button type="button" id="set">Set sample HTML</button>
      <button type="button" id="toggle">Toggle read-only</button>
    </div>

    <h3>Live onChange output</h3>
    <pre id="out"></pre>

    <script type="module">
      import { create } from '/src/index.ts';

      const out = document.getElementById('out');
      const editor = await create('textarea[name=body]', {
        placeholder: 'Start typing…',
        content: undefined, // falls back to the textarea value
        upload: (file) => Promise.resolve(URL.createObjectURL(file)), // demo: local blob URLs
        autosave: { key: 'kontex-demo-draft', debounceMs: 400 },
        onReady: (e) => { out.textContent = e.getHTML(); },
        onChange: (html) => { out.textContent = html; },
      });

      window.__kontex = editor; // exposed for debugging/demo
      document.getElementById('get').onclick = () => alert(editor.getHTML());
      document.getElementById('set').onclick = () =>
        editor.setHTML('<h2>Replaced</h2><p>New content via <code>setHTML()</code>.</p>');
      let editable = true;
      document.getElementById('toggle').onclick = (ev) => {
        editable = !editable;
        editor.setEditable(editable);
        ev.target.textContent = editable ? 'Toggle read-only' : 'Toggle editable';
      };
    </script>
  </body>
</html>
